name: Deploy API na VPS

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Dependências
        run: bun install

      - name: Type Check
        run: bun run typecheck

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: typecheck
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PORT: ${{ secrets.PORT }}
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_NODE_ENV: ${{ vars.NODE_ENV }}
          APP_TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          APP_TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          APP_TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          APP_API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_FRONT_BASE_URL: ${{ vars.FRONT_BASE_URL }}
          APP_TRUSTED_PROXY: ${{ vars.TRUSTED_PROXY }}
          APP_SERVER_HOSTNAME: ${{ vars.SERVER_HOSTNAME }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          APP_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_PASSWORD_RESET_EMAIL_FROM: ${{ vars.PASSWORD_RESET_EMAIL_FROM }}
          APP_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        with:
          # Detalhes da Conexão SSH
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_PORT,APP_DATABASE_URL,APP_JWT_SECRET,APP_NODE_ENV,APP_TUYA_CLIENT_ID,APP_TUYA_CLIENT_SECRET,APP_TUYA_DEVICE_ID,APP_API_BASE_URL,APP_FRONT_BASE_URL,APP_TRUSTED_PROXY,APP_SERVER_HOSTNAME,APP_CORS_ALLOWED_ORIGINS,APP_RESEND_API_KEY,APP_PASSWORD_RESET_EMAIL_FROM,APP_STRIPE_SECRET_KEY,APP_STRIPE_WEBHOOK_SECRET

          # Comandos a serem executados na VPS
          script: |
            # Troca para o usuário de baixa permissão para deploy
            # Nota: o heredoc sem aspas (<<EOF) expande as variáveis no shell atual (SSH),
            # então os valores dos secrets são injetados antes de serem enviados ao sudo.
            sudo -i -u ${{ secrets.VPS_RUNNER_USERNAME }} /bin/bash << EOF
            set -e
            export PATH="/home/${{ secrets.VPS_RUNNER_USERNAME }}/.bun/bin:\$PATH"

            cd stayhub_api

            git fetch origin
            git reset --hard origin/main

            printf 'PORT=$APP_PORT\nDATABASE_URL=$APP_DATABASE_URL\nJWT_SECRET=$APP_JWT_SECRET\nNODE_ENV=$APP_NODE_ENV\nTUYA_CLIENT_ID=$APP_TUYA_CLIENT_ID\nTUYA_CLIENT_SECRET=$APP_TUYA_CLIENT_SECRET\nTUYA_DEVICE_ID=$APP_TUYA_DEVICE_ID\nAPI_BASE_URL=$APP_API_BASE_URL\nFRONT_BASE_URL=$APP_FRONT_BASE_URL\nTRUSTED_PROXY=$APP_TRUSTED_PROXY\nSERVER_HOSTNAME=$APP_SERVER_HOSTNAME\nCORS_ALLOWED_ORIGINS=$APP_CORS_ALLOWED_ORIGINS\nRESEND_API_KEY=$APP_RESEND_API_KEY\nPASSWORD_RESET_EMAIL_FROM=$APP_PASSWORD_RESET_EMAIL_FROM\nSTRIPE_SECRET_KEY=$APP_STRIPE_SECRET_KEY\nSTRIPE_WEBHOOK_SECRET=$APP_STRIPE_WEBHOOK_SECRET\n' > .env

            bun install

            bun run db:baseline-migrations

            bun run db:migrate

            pm2 restart stayhub_api

            EOF
