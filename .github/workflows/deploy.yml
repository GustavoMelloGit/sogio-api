name: Deploy API na VPS

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Dependências
        run: bun install

      - name: Type Check
        run: bun run typecheck

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: typecheck
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PORT: ${{ secrets.PORT }}
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_NODE_ENV: ${{ vars.NODE_ENV }}
          APP_TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          APP_TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          APP_TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          # Config pública (não-sensível), não segredos — mesmo padrão de
          # APP_NODE_ENV. Ambas obrigatórias fora de development desde a
          # introdução da autorização OAuth do MCP: o issuer/discovery e o
          # redirect de consentimento derivam delas, nunca de request.url.
          APP_API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_FRONT_BASE_URL: ${{ vars.FRONT_BASE_URL }}
          # Sem valor por padrão (ausente = untrusted): só é setada quando a
          # API senta atrás de reverse proxy, para X-Forwarded-For alimentar
          # o rate limiter de /token, /register, /authorize com o IP real do
          # chamador em vez do IP do proxy (E5).
          APP_TRUSTED_PROXY: ${{ vars.TRUSTED_PROXY }}
        with:
          # Detalhes da Conexão SSH
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_PORT,APP_DATABASE_URL,APP_JWT_SECRET,APP_NODE_ENV,APP_TUYA_CLIENT_ID,APP_TUYA_CLIENT_SECRET,APP_TUYA_DEVICE_ID,APP_API_BASE_URL,APP_FRONT_BASE_URL,APP_TRUSTED_PROXY

          # Comandos a serem executados na VPS
          script: |
            # Troca para o usuário de baixa permissão para deploy
            # Nota: o heredoc sem aspas (<<EOF) expande as variáveis no shell atual (SSH),
            # então os valores dos secrets são injetados antes de serem enviados ao sudo.
            sudo -i -u ${{ secrets.VPS_RUNNER_USERNAME }} /bin/bash << EOF
            set -e
            export PATH="/home/${{ secrets.VPS_RUNNER_USERNAME }}/.bun/bin:\$PATH"

            cd stayhub_api

            git fetch origin
            git reset --hard origin/main

            printf 'PORT=$APP_PORT\nDATABASE_URL=$APP_DATABASE_URL\nJWT_SECRET=$APP_JWT_SECRET\nNODE_ENV=$APP_NODE_ENV\nTUYA_CLIENT_ID=$APP_TUYA_CLIENT_ID\nTUYA_CLIENT_SECRET=$APP_TUYA_CLIENT_SECRET\nTUYA_DEVICE_ID=$APP_TUYA_DEVICE_ID\nAPI_BASE_URL=$APP_API_BASE_URL\nFRONT_BASE_URL=$APP_FRONT_BASE_URL\nTRUSTED_PROXY=$APP_TRUSTED_PROXY\n' > .env

            bun install

            bun run db:push

            # drizzle-kit push é baseado em diff/introspecção, e já se
            # provou não confiável para detectar certas mudanças em tabelas
            # já existentes (coluna nova com UNIQUE, índice único novo) —
            # reporta "changes applied" sem de fato aplicá-las. Em vez de
            # confiar cegamente, confirma explicitamente que as duas partes
            # mais críticas da autorização OAuth do MCP existem antes de
            # reiniciar: a coluna que liga um código de autorização reusado
            # à sua família de credenciais (E4), e o índice único que
            # impede consentimentos duplicados por (usuário, aplicativo) —
            # a correção do achado crítico #1 da revisão de segurança.
            # Falha alto e visível em vez de reiniciar para um estado
            # silenciosamente incompleto; o app antigo continua no ar via
            # pm2 até alguém investigar.
            bun -e "
            (async () => {
              const { Client } = require('pg');
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              await client.connect();
              const col = await client.query(\"select 1 from information_schema.columns where table_name = 'issued_credentials' and column_name = 'authorization_code_digest'\");
              const idx = await client.query(\"select 1 from pg_indexes where tablename = 'consents' and indexname = 'consents_user_id_app_registration_id_idx'\");
              await client.end();
              if (col.rowCount === 0 || idx.rowCount === 0) {
                console.error('Post-push schema verification FAILED: authorization_code_digest column or the consents unique index is missing. db:push did not apply the full schema. Refusing to restart — investigate and apply the missing DDL from drizzle/0002_jazzy_captain_marvel.sql / drizzle/0003_tired_jocasta.sql before retrying.');
                process.exit(1);
              }
              console.log('Post-push schema verification passed.');
            })();
            "

            pm2 restart stayhub_api

            EOF
